# CONVENTIONS.md § 5. ruff's rev is the ruff of uv.lock: CI's lint job fails when they differ.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # README.md is quarto's render of README.qmd, line breaks included.
        exclude: ^README.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=5000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # metacooler's own: ty on every commit, as CI's lint job runs it.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --locked ty check src tests
        language: system
        pass_filenames: false
        always_run: true
