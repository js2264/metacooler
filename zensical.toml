[project]
site_name = "metacooler"
site_url = "https://js2264.github.io/metacooler"
site_description = "Hi-C contact maps for metagenomes — an extension of the cooler format."
site_author = "Jacques Serizay"
copyright = "&copy; 2026 Jacques Serizay"
extra_css = ["stylesheets/metacooler.css"]
extra_javascript = ["javascripts/metacooler.js"]
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/js2264/metacooler"
repo_name = "js2264/metacooler"

nav = [
     { "Home" = "index.md" },
     { "Getting started" = [
         { "Why metacooler?" = "why.md" },
         { "Installation" = "installation.md" },
         { "Quickstart" = "quickstart.md" },
         { "Concepts" = "concepts.md" }
     ]},
     { "Guides" = [
         { "Creating from pairs" = "guides/from-pairs.md" },
         { "Importing from cooler" = "guides/from-cool.md" },
         { "Collecting single-genome cools" = "guides/collect.md" },
         { "Multi-resolution files" = "guides/multireso.md" },
         { "Exporting data" = "guides/export.md" }
     ]},
     { "Reference" = [
         { "CLI reference" = "cli.md" },
         { "Format specification" = "format.md" },
         { "Python API" = [
             { "MetaCooler class" = "api/metacooler.md" },
             { "I/O functions" = "api/io.md" },
             { "Operations" = "api/ops.md" }
         ]}
     ]},
     { "Benchmarks" = "benchmarks/" },
     { "Changelog" = "changelog.md" }
]


# The theme is zensical's own ("modern" variant), restyled to match
# doc.chromosomix.app: overrides/ swaps in its header and in-page footer, and
# docs/stylesheets/metacooler.css carries the palette and the rest of the look.
[project.theme]
custom_dir = "overrides"
logo = "assets/metacooler-mark.svg"
favicon = "assets/metacooler-mark.svg"
# System fonts, as on chromosomix (no Google Fonts request); the stacks are set
# in metacooler.css.
font = false
features = [
    "navigation.instant",
    "navigation.expand",
    "navigation.sections",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy",
    "content.code.annotate",
    "content.tabs.link"
]

# Light and dark follow the system until the header toggle picks one. Colours
# come from metacooler.css, so `primary`/`accent` are "custom".
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
# Shown next to the site name in the header; bump-my-version keeps it in step
# with the package (see [tool.bumpversion] in pyproject.toml).
release = "0.2.0"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_source = true
show_signature_annotations = true
show_root_heading = true
show_submodules = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
line_length = 80
type_parameter_headings = false
