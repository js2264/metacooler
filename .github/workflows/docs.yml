name: Docs

# CONVENTIONS.md § 8: the site (docs/ and zensical.toml) built on every pull
# request, strictly, and deployed to GitHub Pages, at https://js2264.github.io/metacooler/,
# from devel. Pages deploys from a branch only: the github-pages
# environment refuses a tag, and a release is cut with `git push --follow-tags`,
# so the push of the release commit deploys it, with its version.
on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch: # also started by benchmarks.yml once it publishes a page

permissions:
  contents: read

# A newer push cancels the build of a pull request, never a deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      # The docs dependency group alone (zensical and mkdocstrings): the Python
      # API pages read the sources without importing them, so neither the
      # package nor its dependencies are installed. --strict fails on a
      # warning, such as a link to a page that does not exist.
      - name: The site
        run: uv run --locked --only-group docs zensical build --clean --strict

      # chromokit's files (chromokit.json lists them) are as chromokit wrote them.
      - name: chromokit check
        run: npx --yes github:js2264/chromokit check

      # metacooler's own. A deployment replaces the whole site, so every build
      # serves the latest benchmark page again, at /benchmarks/, with its tables
      # and figures under /benchmarks/_results/: benchmarks.yml keeps both in the
      # benchmark-page release, and starts this workflow once it publishes them.
      - name: The benchmark page
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p site/benchmarks "$RUNNER_TEMP/page"
          gh release download benchmark-page --repo "$GITHUB_REPOSITORY" \
            --pattern benchmarks.html --pattern benchmark-results.zip \
            --dir "$RUNNER_TEMP/page" || true
          if [[ -f $RUNNER_TEMP/page/benchmarks.html ]]; then
            mv "$RUNNER_TEMP/page/benchmarks.html" site/benchmarks/index.html
            if [[ -f $RUNNER_TEMP/page/benchmark-results.zip ]]; then
              unzip -q "$RUNNER_TEMP/page/benchmark-results.zip" -d site/benchmarks
            fi
          else
            echo "::notice::No benchmark page published yet; /benchmarks/ says so."
            repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            cat > site/benchmarks/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>metacooler vs cooler: benchmarks</title>
          <p>No benchmark run has been published yet. The
          <a href="$repo/actions/workflows/benchmarks.yml">Benchmarks workflow</a>
          publishes its page here; see <a href="$repo/tree/$DEFAULT_BRANCH/benchmarks">benchmarks/</a>.</p>
          <p><a href="../">metacooler documentation</a></p>
          </html>
          HTML
          fi

      - name: The site, for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
