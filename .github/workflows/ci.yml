name: CI

on:
  push:
  pull_request:

# A rapid series of pushes to the same ref only bills the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Full Python matrix on Linux; one representative version elsewhere
        # (macOS runners bill at 10x, Windows at 2x).
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "uv.lock"

      - name: Check lock file consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-extras

      - name: List all installed packages
        run: uv pip list

      - name: Check installed package
        run: uv run metacooler --version

      - name: Run tests with coverage
        # Explicit bash: the default shell on windows-latest is pwsh, which
        # does not treat a trailing backslash as a line continuation.
        shell: bash
        run: |
          uv run pytest tests/ \
            --cov=metacooler \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
