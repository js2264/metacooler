name: Benchmarks

# Renders benchmarks/benchmarks.qmd, which times metacooler against cooler from
# the command line on four simulated metagenomes (10^3 to 2 x 10^6 contigs).
# Runs for every release tag, and on demand. The page, its tables and figures
# are kept as a workflow artifact and, for a release, attached to it.
#
# A run on a release tag, or on the default branch with `publish-page` set (the
# default), also publishes them on the documentation site, at /benchmarks/:
# they replace the assets of the `benchmark-page` release, and the run starts
# docs.yml, whose every build serves that release's assets. A run in which a
# command failed publishes nothing.
#
# The datasets are deterministic: they are fetched from the release
# `benchmark-data-v<GENERATOR_VERSION of benchmarks/simulate.py>` when it holds
# them, and otherwise generated here, then published there (on a release run,
# or when `publish-data` is set), so later runs time the very same bytes.
#
# On the standard 2-core, 8 GB runner the whole ladder takes ~4.5 h of the
# job's 6 h: 3 to 5 runs per command (one for a run over 10 min), the queries
# both warm and cold. Most of it is cooler's: its three pixel scans on XL take
# ~22 min a run, and cooler cload pairs is stopped at the 30-min limit there.
# The largest peak was ~6.6 GB (metacooler zoomify on XL). Pick fewer datasets
# for a quicker run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets, smallest first"
        default: "S M L XL"
      timeout:
        description: "Time limit per command (seconds)"
        default: "1800"
      publish-data:
        description: "Publish datasets generated by this run to the data release"
        type: boolean
        default: false
      publish-page:
        description: "Publish the page on the documentation site (default branch only)"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # attach results to the release; publish the data and page releases
  actions: write # start docs.yml once the page is published

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCH_DATASETS: ${{ inputs.datasets || 'S M L XL' }}
      BENCH_TIMEOUT: ${{ inputs.timeout || '1800' }}
      GH_TOKEN: ${{ github.token }}
      DATA: benchmarks/_work/data
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install GNU time and pigz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time pigz

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"

      - name: Install metacooler and cooler
        run: |
          uv sync --locked
          # The notebook's bash cells call `metacooler`, `cooler` and `python`
          # from PATH. uv.lock pins the cooler they are timed against, and the
          # notebook checks it is the one bench.sh names (COOLER_VERSION).
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/metacooler --version
          .venv/bin/cooler --version

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Fetch the datasets, or generate them
        id: data
        run: |
          version=$(sed -n 's/^GENERATOR_VERSION = \([0-9]*\).*/\1/p' benchmarks/simulate.py)
          tag="benchmark-data-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$DATA"
          made=""
          for ds in $BENCH_DATASETS; do
            if gh release download "$tag" --pattern "$ds.tar" --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
              tar -xf "$RUNNER_TEMP/$ds.tar" -C "$DATA" && rm "$RUNNER_TEMP/$ds.tar"
            fi
            out=$(python benchmarks/simulate.py --preset "$ds" --outdir "$DATA/$ds" --keep)
            echo "$out"
            [[ $out == *"up to date"* ]] || made="$made $ds"
          done
          echo "made=${made# }" >> "$GITHUB_OUTPUT"
          # The page says where its data came from when all of it was fetched.
          [[ -z $made ]] && echo "BENCH_DATA_RELEASE=$tag" >> "$GITHUB_ENV"
          du -sh "$DATA"/*

      - name: Publish the generated datasets
        if: steps.data.outputs.made != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish-data)
        env:
          TAG: ${{ steps.data.outputs.tag }}
          MADE: ${{ steps.data.outputs.made }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              echo "Synthetic metagenomic Hi-C datasets for \`benchmarks/benchmarks.qmd\`,"
              echo "made by \`benchmarks/simulate.py\` (generator v${TAG##*-v}) at $GITHUB_SHA."
              echo
              echo "One tarball per dataset: \`contigs.sizes\`, \`contigs.tsv\` (binning),"
              echo "\`genomes.tsv\`, \`contacts.pairs.gz\` (4DN pairs) and \`summary.json\`."
              echo "Regenerate any of them, byte for byte in content, with"
              echo "\`python benchmarks/simulate.py --preset <S|M|L|XL> --outdir <dir>\`."
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --title "Benchmark datasets (generator v${TAG##*-v})" \
              --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest=false
          fi
          for ds in $MADE; do
            tar -cf "$RUNNER_TEMP/$ds.tar" -C "$DATA" "$ds"
            gh release upload "$TAG" "$RUNNER_TEMP/$ds.tar" --clobber
            rm "$RUNNER_TEMP/$ds.tar"
          done

      - name: Render the benchmarks
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render benchmarks/benchmarks.qmd

      - name: Pack the tables and figures
        run: (cd benchmarks && zip -qr "$RUNNER_TEMP/benchmark-results.zip" _results)

      - name: Keep the page, tables, figures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            benchmarks/benchmarks.html
            benchmarks/_results/
            benchmarks/_work/logs/
          if-no-files-found: warn

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::No release $GITHUB_REF_NAME to attach the benchmarks to."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" benchmarks/benchmarks.html \
            "$RUNNER_TEMP/benchmark-results.zip" --clobber

      - name: Fail if a command failed
        run: |
          failed=$(awk -F'\t' 'NR == 1 { for (i = 1; i <= NF; i++) if ($i == "status") s = i; next }
            $s == "error" { print "  " $1 "/" $2 "/" $3 "/" $4 "/" $5 }' benchmarks/_results/timings.tsv)
          if [[ -n $failed ]]; then
            echo "::error::Benchmark commands failed (logs in the artifact):"
            echo "$failed"
            exit 1
          fi

      # The page release holds one page, the latest published, and no history:
      # every version's own page stays attached to its release.
      - name: Publish the page on the documentation site
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (inputs.publish-page && github.ref_name == github.event.repository.default_branch)
        env:
          TAG: benchmark-page
        run: |
          site=$(sed -n 's/^site_url = "\(.*\)"$/\1/p' zensical.toml)/benchmarks/
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "The benchmark page the documentation site serves at <$site>:"
            echo "\`benchmarks.html\` is the render of \`benchmarks/benchmarks.qmd\`, and"
            echo "\`benchmark-results.zip\` its tables and figures. Every run of the"
            echo "Benchmarks workflow that publishes replaces both, and every build of"
            echo "the documentation (\`docs.yml\`) serves them."
            echo
            echo "Published by [run $GITHUB_RUN_ID]($run_url), on \`$GITHUB_REF_NAME\` at"
            echo "$GITHUB_SHA; datasets $BENCH_DATASETS."
          } > "$RUNNER_TEMP/page-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/page-notes.md"
          else
            gh release create "$TAG" --title "Benchmark page (latest published run)" \
              --notes-file "$RUNNER_TEMP/page-notes.md" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload "$TAG" benchmarks/benchmarks.html \
            "$RUNNER_TEMP/benchmark-results.zip" --clobber
          gh workflow run docs.yml --ref "$GITHUB_REF_NAME"
          echo "Published: the documentation deploy now running serves it at <$site>." \
            >> "$GITHUB_STEP_SUMMARY"
