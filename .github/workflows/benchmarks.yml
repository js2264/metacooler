name: Benchmarks

# Renders benchmarks/benchmarks.qmd, which times metacooler against cooler from
# the command line on four synthetic metagenomes (10^3 to 2 x 10^6 contigs).
# Runs for every release tag, and on demand. The page, its tables and figures
# are kept as a workflow artifact and, for a release, attached to it.
#
# The datasets are deterministic: they are fetched from the release
# `benchmark-data-v<GENERATOR_VERSION of benchmarks/simulate.py>` when it holds
# them, and otherwise generated here, then published there (on a release run,
# or when `publish-data` is set), so later runs time the very same bytes.
#
# XL needs ~11 GB of RAM and the whole ladder takes ~3 h: it assumes a standard
# 4-core, 16 GB runner (public repositories). Pick fewer datasets elsewhere.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      datasets:
        description: "Datasets, smallest first"
        default: "S M L XL"
      timeout:
        description: "Time limit per command (seconds)"
        default: "1800"
      cooler:
        description: "cooler to compare against: 'latest', 'locked' (uv.lock's), or a version"
        default: "latest"
      publish-data:
        description: "Publish datasets generated by this run to the data release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # attach results to the release; publish the data release

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BENCH_DATASETS: ${{ inputs.datasets || 'S M L XL' }}
      BENCH_TIMEOUT: ${{ inputs.timeout || '1800' }}
      COOLER: ${{ inputs.cooler || 'latest' }}
      GH_TOKEN: ${{ github.token }}
      DATA: benchmarks/_work/data
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install GNU time and pigz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq time pigz

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: "uv.lock"

      - name: Install metacooler, and the cooler to compare against
        run: |
          uv sync --locked
          case "$COOLER" in
            locked) ;;
            latest) uv pip install --python .venv/bin/python --upgrade cooler ;;
            *) uv pip install --python .venv/bin/python "cooler==$COOLER" ;;
          esac
          # The notebook's bash cells call `metacooler`, `cooler` and `python`
          # from PATH; `uv run` would re-sync cooler back to the lock.
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/metacooler --version
          .venv/bin/cooler --version

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - name: Fetch the datasets, or generate them
        id: data
        run: |
          version=$(sed -n 's/^GENERATOR_VERSION = \([0-9]*\).*/\1/p' benchmarks/simulate.py)
          tag="benchmark-data-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p "$DATA"
          made=""
          for ds in $BENCH_DATASETS; do
            if gh release download "$tag" --pattern "$ds.tar" --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
              tar -xf "$RUNNER_TEMP/$ds.tar" -C "$DATA" && rm "$RUNNER_TEMP/$ds.tar"
            fi
            out=$(python benchmarks/simulate.py --preset "$ds" --outdir "$DATA/$ds" --keep)
            echo "$out"
            [[ $out == *"up to date"* ]] || made="$made $ds"
          done
          echo "made=${made# }" >> "$GITHUB_OUTPUT"
          # The page says where its data came from when all of it was fetched.
          [[ -z $made ]] && echo "BENCH_DATA_RELEASE=$tag" >> "$GITHUB_ENV"
          du -sh "$DATA"/*

      - name: Publish the generated datasets
        if: steps.data.outputs.made != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish-data)
        env:
          TAG: ${{ steps.data.outputs.tag }}
          MADE: ${{ steps.data.outputs.made }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              echo "Synthetic metagenomic Hi-C datasets for \`benchmarks/benchmarks.qmd\`,"
              echo "made by \`benchmarks/simulate.py\` (generator v${TAG##*-v}) at $GITHUB_SHA."
              echo
              echo "One tarball per dataset: \`contigs.sizes\`, \`contigs.tsv\` (binning),"
              echo "\`genomes.tsv\`, \`contacts.pairs.gz\` (4DN pairs) and \`summary.json\`."
              echo "Regenerate any of them, byte for byte in content, with"
              echo "\`python benchmarks/simulate.py --preset <S|M|L|XL> --outdir <dir>\`."
            } > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --title "Benchmark datasets (generator v${TAG##*-v})" \
              --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest=false
          fi
          for ds in $MADE; do
            tar -cf "$RUNNER_TEMP/$ds.tar" -C "$DATA" "$ds"
            gh release upload "$TAG" "$RUNNER_TEMP/$ds.tar" --clobber
            rm "$RUNNER_TEMP/$ds.tar"
          done

      - name: Render the benchmarks
        env:
          QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: quarto render benchmarks/benchmarks.qmd

      - name: Keep the page, tables, figures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            benchmarks/benchmarks.html
            benchmarks/_results/
            benchmarks/_work/logs/
          if-no-files-found: warn

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::No release $GITHUB_REF_NAME to attach the benchmarks to."
            exit 0
          fi
          (cd benchmarks && zip -qr "$RUNNER_TEMP/benchmark-results.zip" _results)
          gh release upload "$GITHUB_REF_NAME" benchmarks/benchmarks.html \
            "$RUNNER_TEMP/benchmark-results.zip" --clobber

      - name: Fail if a command failed
        run: |
          failed=$(awk -F'\t' 'NR > 1 && $6 == "error" { print "  " $1 "/" $2 "/" $3 "/" $4 }' benchmarks/_results/timings.tsv)
          if [[ -n $failed ]]; then
            echo "::error::Benchmark commands failed (logs in the artifact):"
            echo "$failed"
            exit 1
          fi
